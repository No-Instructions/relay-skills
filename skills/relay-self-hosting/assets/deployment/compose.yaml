services:
  relay:
    image: ${RELAY_SERVER_IMAGE:-docker.system3.md/relay-server:latest}
    restart: unless-stopped
    env_file:
      - ./auth.env
    ports:
      - "${RELAY_BIND_ADDRESS:-127.0.0.1}:${RELAY_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ./relay.toml
        target: /app/relay.toml
        read_only: true
        bind:
          create_host_path: false
      - relay-data:/app/data

volumes:
  relay-data:
